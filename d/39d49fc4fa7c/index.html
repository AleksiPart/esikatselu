  const b64 = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/").padEnd(Math.ceil(s.length / 4) * 4, "=")), (c) => c.charCodeAt(0));
  try {
    let k = null;
    if (location.hash.indexOf("#k=") === 0) {
      k = location.hash.slice(3);
      try { sessionStorage.setItem(SK, k); } catch (e) {}
      history.replaceState(null, "", location.pathname + location.search + "#/");
    } else { try { k = sessionStorage.getItem(SK); } catch (e) {} }
    if (!k) { m.textContent = "Linkki on vajaa. Avaa alkuperäinen linkki uudelleen."; return; }
    if (!window.crypto || !crypto.subtle || typeof DecompressionStream === "undefined") { m.textContent = "Selain on liian vanha esikatselulle. Päivitä selain."; return; }
    const raw = b64(document.getElementById("p").textContent.trim());
    const key = await crypto.subtle.importKey("raw", b64(k), "AES-GCM", false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(0, 12) }, key, raw.slice(12));
    const html = await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
    document.open(); document.write(html); document.close();
  } catch (e) { m.textContent = "Esikatselua ei voitu avata. Tarkista, että linkki on kokonainen."; }
})();
</script></body></html>
